<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: flex-end; justify-content: center; }

  /* 气泡 (窗口顶部) */
  .bubble {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.95); color: #333; padding: 1px 4px;
    border-radius: 6px; font-size: 8px; white-space: nowrap;
    box-shadow: 0 1px 3px rgba(0,0,0,.25); opacity: 0; transition: opacity .3s;
    max-width: 42px; overflow: hidden; text-overflow: ellipsis;
    z-index: 10; pointer-events: none;
  }
  .bubble.show { opacity: 1; }

  /* ===== 桌宠形象 ===== */
  .pet {
    position: relative; width: 68px; height: 36px;
    animation: idle 2.5s ease-in-out infinite;
  }
  @keyframes idle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  .pet.bounce { animation: bounce .4s ease; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

  /* 主体：横向长方形 52×24 */
  .body {
    position: relative;
    width: 52px; height: 24px; background: #e67e22;
    margin: 0 auto;
  }
  /* 眼睛（两只） */
  .eye { position: absolute; width: 6px; height: 6px; background: #000; top: 6px; transition: height .1s; }
  .eye-left { left: 10px; } .eye-right { right: 10px; }
  .pet.blink .eye { height: 2px; }
  /* 手：左右对称，垂直紧贴身体两侧 */
  .arm { position: absolute; width: 8px; height: 16px; background: #e67e22; top: 6px; border-radius: 2px; }
  .arm-left { left: -4px; border-top-left-radius: 4px; border-bottom-left-radius: 2px; }
  .arm-right { right: -4px; border-top-right-radius: 4px; border-bottom-right-radius: 2px; }
  /* 腿：两条，分开在下方 */
  .leg { position: absolute; width: 8px; height: 12px; background: #d35400; bottom: -12px; border-radius: 0 0 4px 4px; }
  .leg-left { left: 10px; } .leg-right { right: 10px; }
</style>
</head>
<body>
  <div class="pet" id="pet">
    <span class="bubble" id="bubble"></span>
    <div class="body">
      <div class="eye eye-left"></div>
      <div class="eye eye-right"></div>
      <div class="arm arm-left"></div>
      <div class="arm arm-right"></div>
      <div class="leg leg-left"></div>
      <div class="leg leg-right"></div>
    </div>
  </div>

<script>
  const pet = document.getElementById('pet');
  const bubble = document.getElementById('bubble');

  function say(text, ms) {
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(say._t);
    say._t = setTimeout(() => bubble.classList.remove('show'), ms || 1600);
  }
  function bounce() {
    pet.classList.remove('bounce'); void pet.offsetWidth; pet.classList.add('bounce');
  }
  setInterval(() => {
    pet.classList.add('blink');
    setTimeout(() => pet.classList.remove('blink'), 130);
  }, 3000);

  window.petEngine = {
    onTap: function() { say(['嗨~','主人!','在呢'][Math.floor(Math.random()*3)]); },
    onDoubleTap: function() { bounce(); say('嘿嘿!'); },
    onLongPress: function() { say('唔...'); },
    onDragEnd: function() { say('嘿咻~'); },
    onFling: function() { say('哇!'); }
  };

  pet.addEventListener('click', () => window.petEngine.onTap());
  say('你好呀!', 2200);
</script>
</body>
</html>
