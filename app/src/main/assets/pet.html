<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: flex-end; justify-content: center; }

  /* 气泡 - 顶部可见区 */
  .bubble {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.95); color: #333; padding: 2px 6px;
    border-radius: 8px; font-size: 9px; white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,.25); opacity: 0; transition: opacity .3s;
    max-width: 40px; overflow: hidden; text-overflow: ellipsis;
    z-index: 10; pointer-events: none;
  }
  .bubble.show { opacity: 1; }

  /* 像素小人 */
  .pet {
    position: relative; width: 68px; height: 80px;
    animation: idle 2.5s ease-in-out infinite;
  }
  @keyframes idle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .pet.bounce { animation: bounce .4s ease; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-10px); } }

  .pixel {
    position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
    width: 4px; height: 4px;
    box-shadow: 16px 0px 0 #D2916B,20px 0px 0 #D2916B,24px 0px 0 #D2916B,28px 0px 0 #D2916B,32px 0px 0 #D2916B,36px 0px 0 #D2916B,12px 4px 0 #D2916B,16px 4px 0 #D2916B,20px 4px 0 #D2916B,24px 4px 0 #D2916B,28px 4px 0 #D2916B,32px 4px 0 #D2916B,36px 4px 0 #D2916B,40px 4px 0 #D2916B,12px 8px 0 #D2916B,16px 8px 0 #D2916B,20px 8px 0 #D2916B,24px 8px 0 #D2916B,28px 8px 0 #D2916B,32px 8px 0 #D2916B,36px 8px 0 #D2916B,40px 8px 0 #D2916B,12px 12px 0 #D2916B,16px 12px 0 #D2916B,20px 12px 0 #2E2E2E,24px 12px 0 #2E2E2E,28px 12px 0 #D2916B,32px 12px 0 #D2916B,36px 12px 0 #2E2E2E,40px 12px 0 #2E2E2E,12px 16px 0 #D2916B,16px 16px 0 #D2916B,20px 16px 0 #2E2E2E,24px 16px 0 #2E2E2E,28px 16px 0 #D2916B,32px 16px 0 #D2916B,36px 16px 0 #2E2E2E,40px 16px 0 #2E2E2E,12px 20px 0 #D2916B,16px 20px 0 #D2916B,20px 20px 0 #D2916B,24px 20px 0 #D2916B,28px 20px 0 #D2916B,32px 20px 0 #D2916B,36px 20px 0 #D2916B,40px 20px 0 #D2916B,12px 24px 0 #D2916B,16px 24px 0 #D2916B,20px 24px 0 #D2916B,24px 24px 0 #D2916B,28px 24px 0 #D2916B,32px 24px 0 #D2916B,36px 24px 0 #D2916B,40px 24px 0 #D2916B,12px 28px 0 #D2916B,16px 28px 0 #D2916B,20px 28px 0 #D2916B,24px 28px 0 #D2916B,28px 28px 0 #D2916B,32px 28px 0 #D2916B,36px 28px 0 #D2916B,40px 28px 0 #D2916B,12px 32px 0 #D2916B,16px 32px 0 #D2916B,20px 32px 0 #D2916B,24px 32px 0 #D2916B,28px 32px 0 #D2916B,32px 32px 0 #D2916B,36px 32px 0 #D2916B,40px 32px 0 #D2916B,8px 36px 0 #D2916B,12px 36px 0 #D2916B,16px 36px 0 #D2916B,20px 36px 0 #D2916B,24px 36px 0 #D2916B,28px 36px 0 #D2916B,32px 36px 0 #D2916B,36px 36px 0 #D2916B,40px 36px 0 #D2916B,44px 36px 0 #D2916B,4px 40px 0 #D2916B,8px 40px 0 #D2916B,12px 40px 0 #D2916B,16px 40px 0 #D2916B,20px 40px 0 #D2916B,24px 40px 0 #D2916B,28px 40px 0 #D2916B,32px 40px 0 #D2916B,36px 40px 0 #D2916B,40px 40px 0 #D2916B,44px 40px 0 #D2916B,48px 40px 0 #D2916B,4px 44px 0 #D2916B,8px 44px 0 #D2916B,12px 44px 0 #D2916B,16px 44px 0 #D2916B,20px 44px 0 #D2916B,24px 44px 0 #D2916B,28px 44px 0 #D2916B,32px 44px 0 #D2916B,36px 44px 0 #D2916B,40px 44px 0 #D2916B,44px 44px 0 #D2916B,48px 44px 0 #D2916B,12px 48px 0 #D2916B,16px 48px 0 #D2916B,20px 48px 0 #D2916B,24px 48px 0 #D2916B,28px 48px 0 #D2916B,32px 48px 0 #D2916B,36px 48px 0 #D2916B,40px 48px 0 #D2916B,12px 52px 0 #D2916B,16px 52px 0 #D2916B,20px 52px 0 #D2916B,24px 52px 0 #D2916B,28px 52px 0 #D2916B,32px 52px 0 #D2916B,36px 52px 0 #D2916B,40px 52px 0 #D2916B,16px 56px 0 #D2916B,20px 56px 0 #D2916B,24px 56px 0 #D2916B,28px 56px 0 #D2916B,32px 56px 0 #D2916B,36px 56px 0 #D2916B,20px 60px 0 #D2916B,24px 60px 0 #D2916B,28px 60px 0 #D2916B,32px 60px 0 #D2916B,20px 64px 0 #D2916B,32px 64px 0 #D2916B,20px 68px 0 #D2916B,32px 68px 0 #D2916B,16px 72px 0 #666666,20px 72px 0 #666666,32px 72px 0 #666666,36px 72px 0 #666666;
    image-rendering: pixelated;
  }

  /* 眨眼效果: 覆盖眼睛区域 */
  .pixel::after {
    content: ''; position: absolute; left: 12px; top: 6px;
    width: 8px; height: 8px; background: #2E2E2E; opacity: 0;
    transition: opacity .1s;
  }
  .pet.blink .pixel::after { opacity: 1; }
</style>
</head>
<body>
  <div class="pet" id="pet">
    <span class="bubble" id="bubble"></span>
    <div class="pixel" id="pixel"></div>
  </div>

<script>
  const pet = document.getElementById('pet');
  const bubble = document.getElementById('bubble');

  function say(text, ms) {
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(say._t);
    say._t = setTimeout(() => bubble.classList.remove('show'), ms || 1800);
  }

  function bounce() {
    pet.classList.remove('bounce'); void pet.offsetWidth; pet.classList.add('bounce');
  }

  // 眨眼循环
  setInterval(() => {
    pet.classList.add('blink');
    setTimeout(() => pet.classList.remove('blink'), 120);
  }, 3500);

  // === petEngine: 原生层手势调用 ===
  window.petEngine = {
    onTap: function() {
      const msgs = ['嗨~', '主人!', '(・ω・)', '在呢'];
      say(msgs[Math.floor(Math.random() * msgs.length)]);
    },
    onDoubleTap: function() {
      bounce();
      say('嘿嘿!');
    },
    onLongPress: function() {
      say('唔...');
    },
    onDragEnd: function() {
      say('嘿咻~');
    },
    onFling: function() {
      say('哇——!');
    }
  };

  pet.addEventListener('click', () => window.petEngine.onTap());
  say('你好呀!', 2500);
</script>
</body>
</html>
